{% extends "admin/app_index.html" %}

{% block content %}
  {% if request.path == "/admin/api/" %}
    <div style="
      margin: 14px 0 18px 0;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    ">
      <div style="
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 10px 0;
        opacity: 0.92;
      ">
        Actions globales
      </div>

      <a href="export-db/" style="
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        color: #ffffff;
        background: #2f6feb;
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      "
      onmouseover="this.style.filter='brightness(1.08)'"
      onmouseout="this.style.filter='brightness(1)'"
      >
        <span aria-hidden="true">📦</span>
        Exporter la base de données (API)
      </a>

      <div style="
        margin-top: 8px;
        font-size: 12px;
        opacity: 0.75;
        line-height: 1.35;
      ">
        Export JSON des données de l’application <strong>api</strong>.
      </div>
    </div>
  {% endif %}

  {{ block.super }}
{% endblock %}
